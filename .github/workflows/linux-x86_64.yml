name: Linux x86-64

# Baseline x86-64 build without -march=native (no avx512f), so it runs on any
# x86-64 CPU. Called by the daily playerbot-beta pre-release
# (beta-prerelease.yml) alongside linux_gcc.yml (native, may need AVX512).
on:
  pull_request:
    paths-ignore:
      - 'sql/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      package:
        description: "Upload the binaries-only zip (artifact ci-package-linux-x86_64)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - name: Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -yq libboost-all-dev g++-13 libreadline-dev libbz2-dev binutils
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
    - name: Setup (generic x86-64)
      run: |
        mkdir bin
        cd bin
        cmake ../ -DTOOLS=1 -DELUNA=0 -DCMAKE_INSTALL_PREFIX=check_install -DBUILD_DEPLOY=0
        cd ..
    - name: Build
      run: |
        cd bin
        make -j $(nproc) -k && make install
    - name: Check executables
      run: |
        cd bin/check_install/bin
        ./authserver --version
        ./worldserver --version
    - name: Prove baseline (no AVX512)
      run: |
        set -euo pipefail
        echo "Runner CPU flags (avx512f present on runner is expected):"
        grep -o 'avx512[a-z0-9_]*' /proc/cpuinfo | sort -u || true
        echo "Checking binaries for AVX512/ZMM instructions..."
        if objdump -d bin/check_install/bin/worldserver | grep -qi 'zmm\|avx512'; then
          echo "::error::worldserver contains AVX512/ZMM instructions, not baseline x86-64"
          exit 1
        fi
        if objdump -d bin/check_install/bin/authserver | grep -qi 'zmm\|avx512'; then
          echo "::error::authserver contains AVX512/ZMM instructions, not baseline x86-64"
          exit 1
        fi
        echo "OK: no AVX512/ZMM instructions found."
    # Binaries-only zip for the daily playerbot-beta pre-release (beta-prerelease.yml).
    # Same layout as linux_gcc.yml so it stays drop-in compatible.
    # Zipped here so the executables keep their permissions.
    - name: Package (CI)
      if: ${{ inputs.package }}
      run: |
        mkdir -p ci-package/etc
        cp -a bin/check_install/bin ci-package/bin
        cp src/server/authserver/authserver.conf.dist src/server/worldserver/worldserver.conf.dist \
          modules/mod_playerbots/config/playerbots.conf.dist ci-package/etc/
        ls -la ci-package/bin ci-package/etc
        (cd ci-package && zip -r -q ../ci-linux-x86_64.zip .)
    - name: Upload CI package
      if: ${{ inputs.package }}
      uses: actions/upload-artifact@v4
      with:
        name: ci-package-linux-x86_64
        path: ci-linux-x86_64.zip
        retention-days: 7
        compression-level: 0
