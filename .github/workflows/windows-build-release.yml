name: windows-build-release

# No push trigger: pull requests are checked here, builds can be run by hand, and the
# daily playerbot-beta pre-release (beta-prerelease.yml) calls this workflow.
on:
  pull_request:
    paths-ignore:
      - 'sql/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      package:
        description: "Upload the binaries-only zip (artifact ci-package-win64)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  REPO_DIR : ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/bin/builddir
  BOOST_TOOLSET: "msvc"
  BOOST_VERSION: "1.87.0"
  
jobs:
  build:
    runs-on: windows-2022
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 120
    # A newer push to a pull request cancels its older build; other runs never share a group.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('windows-pr-{0}', github.event.pull_request.number) || format('windows-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
    #git checkout
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - uses: FranzDiebold/github-env-vars-action@v2.8.0
    - name: Create Build Environment
      run: |
        echo "ARCHIVE_FILENAME=$env:CI_REPOSITORY_NAME-${{matrix.TYPE}}-$env:CI_SHA_SHORT.zip" >> $env:GITHUB_ENV
        cmake -E make_directory ${{ env.BUILD_DIR }}
 
    - name: Install boost
      uses: MarkusJx/install-boost@v2.5.1
      id: install-boost
      with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here: 
          # https://github.com/actions/boost-versions/blob/main/versions-manifest.json
          boost_version: ${{env.BOOST_VERSION}}
          # OPTIONAL: Specify a platform version
          platform_version: 2022         
          # OPTIONAL: Specify a toolset on windows
          toolset: ${{env.BOOST_TOOLSET}}
          # OPTIONAL: Specify a custon install location
          boost_install_dir: ${{env.BOOST_INSTALL_DIR}}
          # NOTE: If a boost version matching all requirements cannot be found,
          # this build step will fail          
    - name: windows dependencies
      run: |
        #make
        choco install -y make
        #cmake
        choco install -y cmake
        #openssl
        choco install -y openssl --version=3.1.1
      #git bash shell
      shell: bash

    # The runner image ships one MySQL Server (8.4 on windows-2022 today);
    # FindMySQL.cmake only knows the 5.7-8.3 folder names, so point it at
    # whichever version is installed.
    - name: Locate MySQL
      shell: pwsh
      run: |
        $server = Get-ChildItem "C:/Program Files/MySQL" -Directory -Filter "MySQL Server *" -ErrorAction SilentlyContinue |
          Sort-Object { [version]($_.Name -replace '^MySQL Server ', '') } -Descending |
          Select-Object -First 1
        if (-not $server) { throw "No MySQL Server found under C:/Program Files/MySQL" }
        $root = $server.FullName -replace '\\', '/'
        foreach ($f in "include/mysql.h", "lib/libmysql.lib", "lib/libmysql.dll") {
          if (-not (Test-Path "$root/$f")) { throw "MySQL install at $root has no $f" }
        }
        Write-Host "Using MySQL at $root"
        "MYSQL_ROOT_DIR=$root" >> $env:GITHUB_ENV

    #build and install
    - name: windows build & install
      env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
      run: |
        cd $GITHUB_WORKSPACE
        
        mkdir -p build && cd build
        cmake .. -DTOOLS=ON -DELUNA=0 -A x64
        cmake --build . --config RelWithDebInfo --parallel 4
      #git bash shell
      shell: bash
    - name: Check binaries
      run: |
        cd ${{github.workspace}}/build/bin/RelWithDebInfo
        
        dir
          copy "$env:MYSQL_ROOT_DIR/lib/libmysql.dll" ${{github.workspace}}/build/bin/RelWithDebInfo/libmysql.dll
          copy "C:/Program Files/OpenSSL/bin/libcrypto-3-x64.dll" ${{github.workspace}}/build/bin/RelWithDebInfo/libcrypto-3-x64.dll
          copy "C:/Program Files/OpenSSL/bin/libssl-3-x64.dll" ${{github.workspace}}/build/bin/RelWithDebInfo/libssl-3-x64.dll

        ./authserver --version
        ./worldserver --version

    # Full output with .pdb files, for pull requests and manual runs.
    - name: Upload Artifacts
      if: ${{ !inputs.package }}
      uses: actions/upload-artifact@v4
      with:
        path: ${{github.workspace}}/build/bin/RelWithDebInfo/
        name: PandariaMasterWin64VS2022
        # Set a custom retention for artifacts
        #retention-days: 7

    # Binaries-only zip for the daily playerbot-beta pre-release (beta-prerelease.yml):
    # no .pdb files, plus the playerbots module config.
    - name: Package (CI)
      if: ${{ inputs.package }}
      shell: pwsh
      run: |
        $src = "${{github.workspace}}/build/bin/RelWithDebInfo"
        $stage = "${{github.workspace}}/ci-package"
        New-Item -ItemType Directory -Force $stage | Out-Null
        Get-ChildItem $src -File | Where-Object { $_.Extension -ne '.pdb' } | Copy-Item -Destination $stage
        Copy-Item "${{github.workspace}}/modules/mod_playerbots/config/playerbots.conf.dist" $stage
        Get-ChildItem $stage | Format-Table Name, Length
        Compress-Archive -Path "$stage/*" -DestinationPath "${{github.workspace}}/ci-win64.zip"

    - name: Upload CI package
      if: ${{ inputs.package }}
      uses: actions/upload-artifact@v4
      with:
        name: ci-package-win64
        path: ${{github.workspace}}/ci-win64.zip
        retention-days: 7
        compression-level: 0
