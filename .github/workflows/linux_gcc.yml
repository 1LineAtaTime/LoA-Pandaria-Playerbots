name: GCC

on:
  push:
    paths-ignore:
      - 'sql/**'    
  pull_request:
    paths-ignore:
      - 'sql/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}
    steps:
    - uses: actions/checkout@v4
    - name: Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -yq libboost-all-dev g++-13 libreadline-dev libbz2-dev
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
    - name: Setup
      run: |
        mkdir bin
        cd bin
        cmake ../ -DTOOLS=1 -DELUNA=0 -DCMAKE_INSTALL_PREFIX=check_install
        cd ..
    - name: Build
      run: |
        cd bin
        make -j 4 -k && make install
    - name: Check executables
      run: |
        cd bin/check_install/bin
        ./authserver --version
        ./worldserver --version
    # Binaries-only zip for the rolling "ci-<branch>" pre-release (ci-release.yml).
    # Zipped here so the executables keep their permissions.
    - name: Package (CI)
      if: github.event_name == 'push'
      run: |
        mkdir -p ci-package/etc
        cp -a bin/check_install/bin ci-package/bin
        cp src/server/authserver/authserver.conf.dist src/server/worldserver/worldserver.conf.dist \
          modules/mod_playerbots/config/playerbots.conf.dist ci-package/etc/
        ls -la ci-package/bin ci-package/etc
        (cd ci-package && zip -r -q ../ci-linux-x64.zip .)
    - name: Upload CI package
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: ci-package-linux-x64
        path: ci-linux-x64.zip
        retention-days: 7
        compression-level: 0
